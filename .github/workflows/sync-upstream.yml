name: Sync Upstream

on:
  schedule:
    - cron: '0 3 1 * *' 
  workflow_dispatch: # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 设置 Git 环境
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 克隆你的仓库（dev 分支）
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
          fetch-depth: 0

      - name: 添加上游远程地址
        run: git remote add upstream https://github.com/imsyy/SNav.git

      - name: 获取上游更新
        run: git fetch upstream

      - name: 合并上游 dev 分支
        run: |
          git checkout dev
          git merge --no-edit upstream/dev || echo "已经是最新，无需合并"

      - name: 推送到你的 GitHub 仓库
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git dev
